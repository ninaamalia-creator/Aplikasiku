<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Lensa PDF</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#d32027">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: meja baca abu-kebiruan, toolbar lengket di atas, panel hasil di kiri, halaman bertumpuk di tengah. Stabilo kuning untuk temuan. */
:root{
  --desk:#e3e7ed; --bar:#fbfcfd; --ink:#1a2230; --muted:#5d6879; --line:#d3d9e2;
  --accent:#2445c4; --accent-ink:#ffffff; --field:#ffffff; --hover:#eef1f6;
  --mark:rgba(255,213,0,.42); --mark-cur:rgba(255,128,0,.55); --mark-ring:#e06a00;
  --shadow:0 1px 2px rgba(20,30,50,.12),0 6px 18px rgba(20,30,50,.10);
  --f-ui:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#14171c; --bar:#1c2028; --ink:#e3e8f0; --muted:#97a2b3; --line:#2d333d;
  --accent:#8ea4ff; --accent-ink:#0f1630; --field:#14171c; --hover:#262b35;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#14171c; --bar:#1c2028; --ink:#e3e8f0; --muted:#97a2b3; --line:#2d333d;
  --accent:#8ea4ff; --accent-ink:#0f1630; --field:#14171c; --hover:#262b35;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}

body{background:var(--desk);color:var(--ink);font-family:var(--f-ui);font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:1}
.brand b{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand b i{font-style:normal;color:var(--accent)}
.fname{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 12px;border-radius:8px;
  border:1px solid var(--line);background:var(--field);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.icon{width:36px;padding:0}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;min-width:0;height:38px;padding:0 10px;
  border:1px solid var(--line);border-radius:8px;background:var(--field)}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.search svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:none;height:100%}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);cursor:pointer;
  font-family:var(--f-mono);font-size:13px;user-select:none;background:var(--field)}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.group{display:flex;align-items:center;gap:4px}
.zoomval{font-family:var(--f-mono);font-size:12px;min-width:46px;text-align:center;font-variant-numeric:tabular-nums}
.pageind{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sep{flex:1}

.main{display:grid;grid-template-columns:290px minmax(0,1fr);align-items:start}
aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hh,110px));max-height:calc(100vh - var(--hh,110px) - env(safe-area-inset-top,0px));
  overflow:auto;border-right:1px solid var(--line);background:var(--bar);align-self:start}
aside details{padding:12px 14px}
aside summary{cursor:pointer;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
aside summary::-webkit-details-marker{display:none}
aside summary::after{content:"▾";color:var(--muted);transition:transform .15s}
aside details:not([open]) summary::after{transform:rotate(-90deg)}
.reslist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.reslist button{width:100%;text-align:left;border:0;background:transparent;padding:8px;border-radius:6px;cursor:pointer;
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:baseline;line-height:1.45}
.reslist button:hover{background:var(--hover)}
.reslist button.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.reslist .pg{font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap}
.reslist .sn{font-size:13px;overflow-wrap:anywhere}
.reslist mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.note{color:var(--muted);font-size:13px;line-height:1.5;margin:10px 0 0}

.viewer{overflow-x:auto;min-width:0}
.pages{display:flex;flex-direction:column;align-items:center;gap:22px;padding:22px 16px 60px;width:max-content;min-width:100%;box-sizing:border-box}
.page{position:relative;background:#fff;box-shadow:var(--shadow);max-width:none}
.page canvas{display:block;width:100%;height:100%}
.ov{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;background:var(--mark);mix-blend-mode:multiply;border-radius:2px}
.mk.cur{background:var(--mark-cur);box-shadow:0 0 0 2px var(--mark-ring)}
.pnum{position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.empty{padding:60px 16px;text-align:center;color:var(--muted);line-height:1.6}
.err{margin:22px auto;max-width:520px;padding:14px 16px;border-radius:8px;border:1px solid #d9534f;color:var(--ink);background:color-mix(in srgb,#d9534f 12%,transparent)}
.drop{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--accent) 22%,transparent);
  backdrop-filter:blur(2px)}
.drop div{padding:24px 32px;border:2px dashed var(--accent);border-radius:12px;background:var(--bar);font-weight:600}
.sample{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:4px;font-size:11px;font-family:var(--f-mono);background:var(--hover);color:var(--muted)}

/* Tab mode */
.tabs{display:flex;gap:4px;padding:3px;background:var(--hover);border-radius:10px;align-self:flex-start}
.tabs button{height:32px;padding:0 16px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--field);color:var(--ink);box-shadow:0 1px 2px rgba(20,30,50,.18)}
body[data-mode="convert"] .viewrow,body[data-mode="convert"] .main,body[data-mode="convert"] .fname{display:none}

/* Ubah ke PDF */
#convert{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 64px}
.cv-wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.cv-h{margin:0;font-size:22px;letter-spacing:-.01em;text-wrap:balance}
.cv-sub{margin:-8px 0 0;color:var(--muted);line-height:1.5}
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kind{position:relative;display:flex;flex-direction:column;gap:6px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bar);cursor:pointer;min-width:0}
.kind input{position:absolute;opacity:0;pointer-events:none}
.kind:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kind:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.kind b{font-size:15px}
.kind small{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.ftag{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 6px;border-radius:5px;color:#fff;font:600 11px var(--f-mono);letter-spacing:.04em;align-self:flex-start}
.ftag.w{background:#2b579a}.ftag.x{background:#1f7244}.ftag.i{background:#b7531d}.ftag.p{background:#d32027}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 16px;border:2px dashed var(--line);border-radius:12px;background:var(--bar);cursor:pointer;text-align:center}
.pick:hover{border-color:var(--accent)}
.pick svg{width:28px;height:28px;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pick b{font-size:15px}
.pick small{color:var(--muted);line-height:1.5}
.chosen{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bar);min-width:0}
.chosen .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.chosen .sz{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.thumbs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.thumbs li{position:relative;display:flex;flex-direction:column;gap:6px;padding:6px;border:1px solid var(--line);border-radius:10px;background:var(--bar)}
.thumbs img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;background:var(--hover);display:block}
.thumbs .no{position:absolute;top:10px;left:10px;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:var(--accent);color:var(--accent-ink);font:600 11px/22px var(--f-mono);text-align:center}
.thumbs .act{display:flex;gap:4px}
.thumbs .act button{flex:1;height:28px;border:1px solid var(--line);border-radius:6px;background:var(--field);cursor:pointer;font-size:13px;padding:0}
.thumbs .act button:hover{background:var(--hover)}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.opts label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.opts select{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:0 8px;color:var(--ink);font:inherit}
.bigbtn{height:46px;font-size:15px;width:100%}
.cvstatus{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.result{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--bar)}
.result .top{display:flex;gap:12px;align-items:center;min-width:0}
.result .nm{font-weight:700;overflow-wrap:anywhere}
.result .meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.result .acts{display:flex;flex-wrap:wrap;gap:8px}
.cvnote{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
#render-host{position:absolute;left:-100000px;top:0;width:max-content;color:#000;background:#fff;color-scheme:light}
#render-host .docx-wrapper{background:#fff!important;padding:0!important;display:block!important}
#render-host section.docx{box-shadow:none!important;margin:0 0 20px!important}

@media (max-width:760px){
  .tabs{align-self:stretch}.tabs button{flex:1}
  .main{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  .reslist{max-height:40vh;overflow:auto}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header id="hdr">
  <div class="row">
    <div class="brand"><b>Lensa<i>PDF</i></b><span class="fname" id="fname">Belum ada file</span></div>
    <label class="btn primary" for="file">
      <svg viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 18v-6M9 15l3-3 3 3"/></svg>
      Buka PDF
    </label>
    <button class="btn" id="install" hidden>Pasang</button>
    <input type="file" id="file" accept="application/pdf,.pdf" hidden>
  </div>
  <div class="tabs" role="tablist" aria-label="Mode">
    <button role="tab" id="tab-view" aria-selected="true">Baca &amp; Cari</button>
    <button role="tab" id="tab-conv" aria-selected="false">Ubah ke PDF</button>
  </div>
  <div class="row viewrow">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cari kata di dokumen…" autocomplete="off" aria-label="Cari kata">
      <span class="count" id="count"></span>
    </div>
    <label class="chip" title="Bedakan huruf besar dan kecil"><input type="checkbox" id="cs">Aa</label>
    <div class="group">
      <button class="btn icon" id="prev" title="Temuan sebelumnya (Shift+Enter)" aria-label="Temuan sebelumnya"><svg viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg></button>
      <button class="btn icon" id="next" title="Temuan berikutnya (Enter)" aria-label="Temuan berikutnya"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
    </div>
    <span class="sep hide-sm"></span>
    <div class="group">
      <button class="btn icon" id="zout" aria-label="Perkecil"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <span class="zoomval" id="zval">100%</span>
      <button class="btn icon" id="zin" aria-label="Perbesar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="btn" id="zfit" title="Sesuaikan dengan lebar layar">Pas lebar</button>
    </div>
    <span class="pageind" id="pind">–</span>
  </div>
</header>

<div class="main">
  <aside>
    <details id="resbox">
      <summary><span id="restitle">Hasil pencarian</span></summary>
      <p class="note" id="resnote">Ketik kata di kolom pencarian.</p>
      <ul class="reslist" id="reslist"></ul>
    </details>
  </aside>
  <div class="viewer" id="viewer">
    <div class="pages" id="pages"><div class="empty">Memuat…</div></div>
  </div>
</div>
<section id="convert" hidden>
  <div class="cv-wrap">
    <h1 class="cv-h">Ubah ke PDF</h1>
    <p class="cv-sub">File diubah langsung di HP Anda. Tidak diunggah dan tidak disimpan.</p>
    <div class="kinds" role="radiogroup" aria-label="Jenis file">
      <label class="kind"><input type="radio" name="kind" value="word" id="k-word" checked><span class="ftag w">W</span><b>Word</b><small>.docx</small></label>
      <label class="kind"><input type="radio" name="kind" value="excel" id="k-excel"><span class="ftag x">X</span><b>Excel</b><small>.xlsx .xls .csv</small></label>
      <label class="kind"><input type="radio" name="kind" value="image" id="k-image"><span class="ftag i">JPG</span><b>Gambar</b><small>.jpg .png</small></label>
    </div>
    <label class="pick" for="cvfile" id="pick">
      <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <b id="pick-t">Pilih file Word</b>
      <small id="pick-s">Atau bagikan file dari WhatsApp ke Lensa PDF</small>
    </label>
    <input type="file" id="cvfile" hidden>
    <div class="chosen" id="chosen" hidden><span class="ftag" id="chosen-tag"></span><span class="nm" id="chosen-nm"></span><span class="sz" id="chosen-sz"></span><button class="btn icon" id="chosen-x" aria-label="Hapus file"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <ul class="thumbs" id="thumbs" hidden></ul>
    <div class="opts" id="opt-image" hidden>
      <label for="o-page">Ukuran halaman <select id="o-page"><option value="a4">A4</option><option value="fit">Ikuti ukuran gambar</option></select></label>
      <label for="o-margin">Tepi <select id="o-margin"><option value="24">Ada tepi</option><option value="0">Tanpa tepi</option></select></label>
    </div>
    <div class="opts" id="opt-excel" hidden>
      <label for="o-orient">Arah kertas <select id="o-orient"><option value="auto">Otomatis</option><option value="portrait">Tegak</option><option value="landscape">Mendatar</option></select></label>
    </div>
    <button class="btn primary bigbtn" id="cvgo" disabled>Ubah ke PDF</button>
    <div class="cvstatus" id="cvstatus" hidden><span id="cvmsg">Menyiapkan…</span><div class="bar"><i id="cvbar"></i></div></div>
    <div id="cverr" class="err" hidden style="margin:0;max-width:none"></div>
    <div class="result" id="cvresult" hidden>
      <div class="top"><span class="ftag p">PDF</span><div style="min-width:0"><div class="nm" id="r-nm"></div><div class="meta" id="r-meta"></div></div></div>
      <div class="acts">
        <button class="btn primary" id="r-save">Simpan PDF</button>
        <button class="btn" id="r-share" hidden>Bagikan</button>
        <button class="btn" id="r-view">Lihat di Lensa</button>
      </div>
      <p class="cvnote" id="r-note"></p>
    </div>
  </div>
</section>
<div id="render-host" aria-hidden="true"></div>
<div class="drop" id="drop" hidden><div>Lepaskan file di sini</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(function(){
const lib = window.pdfjsLib;
const $ = id => document.getElementById(id);
const pagesEl=$('pages'), viewer=$('viewer'), qEl=$('q'), csEl=$('cs'), countEl=$('count');
const resList=$('reslist'), resNote=$('resnote'), resTitle=$('restitle'), resBox=$('resbox');
const S={doc:null,pages:[],zoom:1,fit:true,matches:[],cur:-1,load:0};

if(!lib){pagesEl.innerHTML='<div class="err">Pustaka pembaca PDF gagal dimuat. Periksa koneksi internet lalu muat ulang halaman.</div>';return;}
lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

if(matchMedia('(min-width:761px)').matches) resBox.open=true;
function setHH(){document.documentElement.style.setProperty('--hh',$('hdr').offsetHeight+'px');}
setHH(); addEventListener('resize',setHH);

const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- Muat dokumen ---------- */
async function openPdf(data,name,isSample){
  const id=++S.load;
  if(S.doc){try{S.doc.destroy()}catch(e){}}
  S.doc=null;S.pages=[];S.matches=[];S.cur=-1;
  pagesEl.innerHTML='<div class="empty">Membuka dokumen…</div>';
  $('fname').innerHTML=esc(name)+(isSample?'<span class="sample">contoh</span>':'');
  let doc;
  try{doc=await lib.getDocument({data}).promise;}
  catch(e){
    if(id!==S.load)return;
    const msg=e&&e.name==='PasswordException'
      ?'PDF ini dilindungi kata sandi, jadi tidak bisa dibuka di sini.'
      :'File ini tidak bisa dibuka. Pastikan formatnya PDF dan filenya tidak rusak.';
    pagesEl.innerHTML='<div class="err">'+msg+'</div>';updateResults();return;
  }
  if(id!==S.load){doc.destroy();return;}
  S.doc=doc;pagesEl.innerHTML='';
  for(let i=1;i<=doc.numPages;i++){
    const page=await doc.getPage(i); if(id!==S.load)return;
    const vp=page.getViewport({scale:1});
    const wrap=document.createElement('div');wrap.className='page';wrap.style.aspectRatio=vp.width+' / '+vp.height;
    const canvas=document.createElement('canvas');const ov=document.createElement('div');ov.className='ov';
    const num=document.createElement('span');num.className='pnum';num.textContent=i;
    wrap.append(canvas,ov,num);pagesEl.appendChild(wrap);
    const p={i,page,vp,wrap,canvas,ov,rz:null,visible:false,text:null,lower:null,segs:[]};
    S.pages.push(p);io.observe(wrap);
    if(i===1){S.fit=true;fitZoom();} else sizePage(p);
  }
  updatePageInd();
  // Indeks teks
  let anyText=false;
  for(const p of S.pages){
    if(id!==S.load)return;
    resNote.textContent='Mengindeks teks… halaman '+p.i+' dari '+S.pages.length;
    try{
      const tc=await p.page.getTextContent();
      let t='';const segs=[];
      for(const it of tc.items){
        if(it.str){segs.push({it,start:t.length,end:t.length+it.str.length});t+=it.str;}
        if(it.hasEOL&&!t.endsWith(' '))t+=' ';
      }
      p.text=t;p.segs=segs;p.styles=tc.styles||{};const lo=t.toLocaleLowerCase();p.lower=lo.length===t.length?lo:t;
      if(t.trim())anyText=true;
    }catch(e){p.text='';}
    if(qEl.value.trim()) runSearch(true);
  }
  S.noText=!anyText;
  runSearch(true);
}

/* ---------- Ukuran & render ---------- */
function sizePage(p){p.wrap.style.width=(p.vp.width*S.zoom)+'px';}
function applyZoom(){
  $('zval').textContent=Math.round(S.zoom*100)+'%';
  S.pages.forEach(sizePage);
  S.pages.forEach(p=>{if(p.visible)renderPage(p)});
  updatePageInd();
}
function fitZoom(){
  if(!S.pages.length||!viewer.clientWidth)return;
  const maxW=Math.max(...S.pages.map(p=>p.vp.width));
  const avail=viewer.clientWidth-32;
  S.zoom=Math.max(.25,Math.min(3,avail/maxW));applyZoom();
}
function setZoom(z){S.fit=false;S.zoom=Math.max(.25,Math.min(5,z));applyZoom();}
$('zin').onclick=()=>setZoom(S.zoom*1.2);
$('zout').onclick=()=>setZoom(S.zoom/1.2);
$('zfit').onclick=()=>{S.fit=true;fitZoom();};
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(S.fit)fitZoom()},150)});

async function renderPage(p){
  const z=S.zoom; if(p.rz===z)return; p.rz=z;
  if(p.task){try{p.task.cancel()}catch(e){}}
  const dpr=Math.min(window.devicePixelRatio||1,2);
  let sc=z*dpr;const area=p.vp.width*p.vp.height*sc*sc,maxPx=14e6;
  if(area>maxPx)sc*=Math.sqrt(maxPx/area);
  const vp=p.page.getViewport({scale:sc});
  const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
  const task=p.page.render({canvasContext:c.getContext('2d'),viewport:vp});p.task=task;
  try{await task.promise;}catch(e){if(!(e&&e.name==='RenderingCancelledException'))p.rz=null;return;}
  if(p.rz!==z)return;
  p.canvas.replaceWith(c);p.canvas=c;
}
const io=new IntersectionObserver(es=>{
  for(const e of es){const p=S.pages.find(x=>x.wrap===e.target);if(!p)continue;
    p.visible=e.isIntersecting;if(p.visible)renderPage(p);}
},{rootMargin:'800px 200px'});

function updatePageInd(){
  if(!S.pages.length){$('pind').textContent='–';return;}
  const top=$('hdr').getBoundingClientRect().bottom+30;let cur=1;
  for(const p of S.pages){if(p.wrap.getBoundingClientRect().bottom>top){cur=p.i;break;}}
  $('pind').textContent='Hal. '+cur+' / '+S.pages.length;
}
let st=false;addEventListener('scroll',()=>{if(!st){st=true;requestAnimationFrame(()=>{st=false;updatePageInd()})}},{passive:true});

/* ---------- Pencarian ---------- */
function runSearch(keepPos){
  const q=qEl.value;const cs=csEl.checked;
  const prevCur=S.matches[S.cur];
  S.pages.forEach(p=>p.ov.innerHTML='');
  S.matches=[];S.cur=-1;
  if(q.trim()){
    const needle=cs?q:q.toLocaleLowerCase();
    for(const p of S.pages){
      if(!p.text)continue;const hay=cs?p.text:p.lower;let k=0;
      while((k=hay.indexOf(needle,k))!==-1){S.matches.push({p,start:k,end:k+needle.length});k+=needle.length;}
    }
    S.matches.forEach(drawMatch);
  }
  updateResults();
  if(S.matches.length){
    let idx=0;
    if(keepPos&&prevCur){const j=S.matches.findIndex(m=>m.p===prevCur.p&&m.start===prevCur.start);if(j>=0)idx=j;}
    setCur(idx,!keepPos);
  }else updateCount();
}
const mctx=document.createElement('canvas').getContext('2d');
function frac(it,styles,n){
  if(n<=0)return 0;if(n>=it.str.length)return 1;
  const ff=((styles||{})[it.fontName]||{}).fontFamily||'sans-serif';
  mctx.font='100px '+ff;const tw=mctx.measureText(it.str).width;
  return tw?mctx.measureText(it.str.slice(0,n)).width/tw:n/it.str.length;
}
function drawMatch(m,k){
  const p=m.p,T=lib.Util.transform;
  for(const s of p.segs){
    if(s.end<=m.start)continue;if(s.start>=m.end)break;
    const a=Math.max(m.start,s.start)-s.start,b=Math.min(m.end,s.end)-s.start;
    const it=s.it,tx=T(p.vp.transform,it.transform);
    const h=Math.hypot(tx[2],tx[3]);const W=it.width||h*.5*it.str.length;
    const fa=frac(it,p.styles,a),fb=frac(it,p.styles,b);
    const x=tx[4]+W*fa,y=tx[5]-h*.92,w=W*(fb-fa),hh=h*1.18;
    const d=document.createElement('div');d.className='mk';d.dataset.k=k;
    d.style.left=(x/p.vp.width*100)+'%';d.style.top=(y/p.vp.height*100)+'%';
    d.style.width=(w/p.vp.width*100)+'%';d.style.height=(hh/p.vp.height*100)+'%';
    p.ov.appendChild(d);
  }
}
function updateCount(){
  const n=S.matches.length;
  countEl.textContent=!qEl.value.trim()?'':n?(S.cur+1)+' / '+n:'0 hasil';
  $('prev').disabled=$('next').disabled=n===0;
}
function setCur(k,scroll){
  const n=S.matches.length;if(!n)return;
  S.cur=((k%n)+n)%n;
  pagesEl.querySelectorAll('.mk.cur').forEach(e=>e.classList.remove('cur'));
  const els=pagesEl.querySelectorAll('.mk[data-k="'+S.cur+'"]');els.forEach(e=>e.classList.add('cur'));
  if(scroll!==false&&els[0])els[0].scrollIntoView({block:'center',inline:'center',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});
  resList.querySelectorAll('button.on').forEach(b=>b.classList.remove('on'));
  const b=resList.querySelector('button[data-k="'+S.cur+'"]');if(b){b.classList.add('on');b.scrollIntoView({block:'nearest'});}
  updateCount();
}
function updateResults(){
  const n=S.matches.length,q=qEl.value.trim();
  resTitle.textContent=q?('Hasil pencarian ('+n+')'):'Hasil pencarian';
  resList.innerHTML='';
  if(!S.doc){resNote.textContent='Buka file PDF untuk mulai mencari.';resNote.hidden=false;return;}
  if(S.noText){resNote.textContent='PDF ini berupa gambar hasil pindaian, jadi tidak ada teks yang bisa dicari.';resNote.hidden=false;return;}
  if(!q){resNote.textContent='Ketik kata di kolom pencarian. Tekan Enter untuk lompat ke temuan berikutnya.';resNote.hidden=false;return;}
  if(!n){resNote.textContent='Kata "'+q+'" tidak ditemukan di dokumen ini.';resNote.hidden=false;return;}
  resNote.hidden=n<=500;resNote.textContent='Menampilkan 500 temuan pertama.';
  const frag=document.createDocumentFragment();
  S.matches.slice(0,500).forEach((m,k)=>{
    const t=m.p.text,a=Math.max(0,m.start-36),b=Math.min(t.length,m.end+48);
    const li=document.createElement('li');const btn=document.createElement('button');btn.dataset.k=k;
    btn.innerHTML='<span class="pg">Hal. '+m.p.i+'</span><span class="sn">'+(a>0?'…':'')+esc(t.slice(a,m.start))+'<mark>'+esc(t.slice(m.start,m.end))+'</mark>'+esc(t.slice(m.end,b))+(b<t.length?'…':'')+'</span>';
    btn.onclick=()=>setCur(k);li.appendChild(btn);frag.appendChild(li);
  });
  resList.appendChild(frag);
}
let qt;qEl.addEventListener('input',()=>{clearTimeout(qt);qt=setTimeout(()=>runSearch(false),180)});
csEl.addEventListener('change',()=>runSearch(false));
qEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();setCur(S.cur+(e.shiftKey?-1:1));}});
$('next').onclick=()=>setCur(S.cur+1);$('prev').onclick=()=>setCur(S.cur-1);
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();qEl.focus();qEl.select();}});

/* ---------- Buka file ---------- */
function readFile(f,all){

/* ---------- Dokumen contoh ---------- */
function samplePdf(){
  const pages=[
   {title:'Panduan Singkat Membaca Dokumen',lines:[
    'Selamat datang di Lensa PDF. Ini adalah dokumen contoh agar Anda bisa langsung mencoba.',
    'Buka dokumen Anda sendiri dengan tombol Buka PDF, atau seret file ke jendela ini.',
    '',
    'Semua proses berjalan di perangkat Anda. Dokumen tidak diunggah dan tidak disimpan.',
    'Begitu halaman ditutup atau dimuat ulang, dokumen hilang dari aplikasi.',
    '',
    'Cara mencari kata:',
    '1. Ketik kata di kolom pencarian, misalnya: dokumen.',
    '2. Setiap temuan ditandai warna kuning seperti stabilo.',
    '3. Temuan yang sedang aktif berwarna oranye.',
    '4. Tekan Enter untuk temuan berikutnya, Shift+Enter untuk sebelumnya.',
    '',
    'Daftar hasil menampilkan potongan kalimat di sekitar setiap temuan.',
    'Ketuk salah satu hasil untuk langsung melompat ke halaman tersebut.']},
   {title:'Tips Pencarian',lines:[
    'Tombol Aa membedakan huruf besar dan kecil. Matikan untuk pencarian yang lebih luas.',
    'Contoh: dengan Aa aktif, kata Dokumen dan dokumen dianggap berbeda.',
    '',
    'Anda juga bisa mencari frasa, misalnya: halaman tersebut.',
    'Gunakan tombol plus dan minus untuk memperbesar tampilan dokumen.',
    'Tombol Pas lebar menyesuaikan halaman dengan lebar layar.',
    '',
    'Catatan: PDF hasil pindaian (gambar) tidak berisi teks,',
    'sehingga kata di dalamnya tidak dapat dicari.']}
  ];
  const e=s=>s.replace(/[\\()]/g,m=>'\\'+m);
  const n=pages.length,objs=[];
  objs[1]='<< /Type /Catalog /Pages 2 0 R >>';
  objs[2]='<< /Type /Pages /Kids ['+pages.map((_,i)=>(4+i*2)+' 0 R').join(' ')+'] /Count '+n+' >>';
  objs[3]='<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  pages.forEach((p,i)=>{
    const pid=4+i*2,cid=pid+1;
    let s='BT /F1 20 Tf 64 752 Td ('+e(p.title)+') Tj ET\nBT /F1 11 Tf 64 716 Td 18 TL\n';
    p.lines.forEach(l=>{s+='('+e(l)+') Tj T*\n';});
    s+='ET\nBT /F1 9 Tf 64 40 Td (Dokumen contoh - halaman '+(i+1)+' dari '+n+') Tj ET';
    objs[pid]='<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R >> >> /Contents '+cid+' 0 R >>';
    objs[cid]='<< /Length '+s.length+' >>\nstream\n'+s+'\nendstream';
  });
  let out='%PDF-1.4\n';const off=[];
  for(let i=1;i<objs.length;i++){off[i]=out.length;out+=i+' 0 obj\n'+objs[i]+'\nendobj\n';}
  const x=out.length;
  out+='xref\n0 '+objs.length+'\n0000000000 65535 f \n';
  for(let i=1;i<objs.length;i++)out+=String(off[i]).padStart(10,'0')+' 00000 n \n';
  out+='trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+x+'\n%%EOF';
  return new TextEncoder().encode(out);
}

/* ---------- File dari menu Bagikan ---------- */
async function openShared(){
  try{
    const c=await caches.open('lensa-share');const base=new URL('./',location.href).href;
    const keys=(await c.keys()).filter(r=>r.url.startsWith(base+'shared'));
    keys.sort((a,b)=>a.url.localeCompare(b.url,undefined,{numeric:true}));
    const files=[];
    for(const k of keys){const r=await c.match(k);
      files.push(new File([await r.blob()],decodeURIComponent(r.headers.get('x-name')||'dokumen'),{type:r.headers.get('content-type')||''}));
      await c.delete(k);}
    if(!files.length)return false;
    const pdf=files.find(f=>/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name));
    if(pdf&&files.length===1){setMode('view');openPdf(new Uint8Array(await pdf.arrayBuffer()),pdf.name,false);return true;}
    qEl.value='';openPdf(samplePdf(),'Panduan Lensa PDF.pdf',true);
    if(window.LensaConvert){LensaConvert.take(files,true);return true;}
    return false;
  }catch(e){return false;}
}
async function start(){
  const shared=new URLSearchParams(location.search).has('shared');
  if(shared){history.replaceState(null,'',location.pathname);if(await openShared())return;
    pagesEl.innerHTML='<div class="err">File yang dibagikan tidak terbaca. Coba bagikan sekali lagi dari WhatsApp.</div>';return;}
  qEl.value='dokumen';openPdf(samplePdf(),'Panduan Lensa PDF.pdf',true);
  if(location.hash==='#ubah')setMode('convert');
}

<script>

const KIND={

  excel:{t:'Pilih file Excel',s:'Format .xlsx, .xls, atau .csv. Setiap sheet jadi bagian PDF.',accept:'.xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv',tag:'X',cls:'x'},
  image:{t:'Pilih gambar',s:'Bisa pilih beberapa sekaligus. Setiap gambar jadi satu halaman.',accept:'image/*',tag:'JPG',cls:'i'}
};
const C={kind:'word',file:null,images:[],blob:null,name:'',busy:false};

function kindOf(f){
  const n=(f.name||'').toLowerCase(),t=(f.type||'').toLowerCase();
  if(/\.pdf$/.test(n)||t==='application/pdf')return 'pdf';
  if(/\.docx$/.test(n)||t.includes('wordprocessingml'))return 'word';
  if(/\.doc$/.test(n)||t==='application/msword')return 'oldword';
  if(/\.(xlsx|xls|csv)$/.test(n)||t.includes('spreadsheetml')||t==='application/vnd.ms-excel'||t==='text/csv')return 'excel';

function render(){

  if(img)C.images.forEach((it,i)=>{

    li.querySelector('img').src=it.url;

function showErr(msg){const e=$('cverr');e.textContent=msg;e.hidden=!msg;}

function take(files,auto){
  files=[...files].filter(Boolean);if(!files.length)return;

  showErr('');$('cvresult').hidden=true;

  if(k==='pdf'){const f=files[0];Lensa.setMode('view');f.arrayBuffer().then(b=>Lensa.openPdf(new Uint8Array(b),f.name,false));return;}
  if(!k){showErr('"'+files[0].name+'" tidak bisa diubah. Pilih file Word (.docx), Excel (.xlsx), atau gambar (JPG/PNG).');return;}

    else out=await imagesToPdf(C.images,$('o-page').value,+$('o-margin').value);
    C.blob=out.blob;C.name=out.name;
    $('r-nm').textContent=out.name;
    $('r-meta').textContent=out.pages+' halaman · '+fmtSize(out.blob.size);
    $('r-note').textContent=C.kind==='excel'
      ?'Teks di PDF ini bisa dicari di Lensa.'
      :'Halaman PDF ini berupa gambar, jadi teksnya tidak bisa dicari.'+(C.kind==='word'?' Jika ada font yang tidak terpasang di HP, tampilannya bisa sedikit berbeda dari aslinya.':'');
    try{const f=new File([out.blob],out.name,{type:'application/pdf'});$('r-share').hidden=!(navigator.canShare&&navigator.canShare({files:[f]}));}catch(e){$('r-share').hidden=true;}
    $('cvresult').hidden=false;$('cvstatus').hidden=true;
    $('cvresult').scrollIntoView({block:'nearest'});
  }catch(e){
    console.error(e);$('cvstatus').hidden=true;
    showErr(e&&e.message==='lib'
      ?'Bagian pengubah file gagal dimuat. Periksa koneksi internet lalu coba lagi.'
      :(e&&e.userMsg)||'File ini gagal diubah. Pastikan filenya tidak rusak atau dikunci kata sandi, lalu coba lagi.');
  }finally{C.busy=false;render();$('render-host').innerHTML='';}
}
const uerr=m=>{const e=new Error(m);e.userMsg=m;return e;};

function clean(v){
  return String(v==null?'':v).normalize('NFKC').replace(/\t/g,' ')
    .replace(/[^\x00-\xFF‘’“”–—…•€]/g,'?');
}

/* Word: render tata letak dengan docx-preview, foto per halaman */
async function wordToPdf(file){
  status('Memuat pengubah Word…',.05);
  await loadAll(['jspdf','h2c','jszip','docx']);
  status('Membaca dokumen…',.15);
  const host=$('render-host');host.innerHTML='';
  const body=document.createElement('div');host.appendChild(body);
  await window.docx.renderAsync(await file.arrayBuffer(),body,null,{
    inWrapper:true,ignoreWidth:false,ignoreHeight:false,ignoreFonts:false,breakPages:true,
    ignoreLastRenderedPageBreak:false,renderHeaders:true,renderFooters:true,renderFootnotes:true,
    renderEndnotes:true,useBase64URL:true,experimental:true});
  try{await document.fonts.ready;}catch(e){}
  await new Promise(r=>setTimeout(r,120));
  const secs=[...body.querySelectorAll('section.docx')];
  if(!secs.length)throw uerr('Dokumen Word ini kosong atau tidak terbaca.');
  const {jsPDF}=window.jspdf;let doc=null,pages=0;
  for(let si=0;si<secs.length;si++){
    const sec=secs[si];status('Membuat halaman '+(pages+1)+'…',.2+.75*si/secs.length);
    const cs=getComputedStyle(sec);const w=sec.offsetWidth,h=sec.scrollHeight;
    const pageH=parseFloat(cs.minHeight)||w*1.4142;
    const padT=parseFloat(cs.paddingTop)||0,padB=parseFloat(cs.paddingBottom)||0;
    const scale=Math.max(.6,Math.min(2,Math.sqrt(60e6/(w*h)),30000/h));
    const canvas=await html2canvas(sec,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false,scrollX:0,scrollY:0,
      windowWidth:Math.max(document.documentElement.clientWidth,w+40)});
    const k=canvas.width/w;
    for(const pc of slice(canvas,pageH*k,padT*k,padB*k)){
      const W=w*.75,H=pageH*.75,o=W>H?'l':'p';
      if(!doc)doc=new jsPDF({unit:'pt',format:[W,H],orientation:o});else doc.addPage([W,H],o);
      doc.addImage(pc.toDataURL('image/jpeg',.88),'JPEG',0,0,W,H,undefined,'FAST');pages++;
      await new Promise(r=>setTimeout(r));
    }
  }
  status('Menyusun PDF…',.97);
  return {blob:doc.output('blob'),name:baseName(file.name)+'.pdf',pages};
}
function slice(canvas,pageH,padT,padB){
  const W=canvas.width,H=canvas.height,out=[];let y=0,first=true;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  while(H-y>(first?2:padB+4)){
    const top=first?0:padT,room=first?pageH:pageH-padT;
    let end;
    if(H-y<=room)end=H;
    else{const avail=room-padB;end=findCut(ctx,W,y+avail,y+avail*.75);}
    const pc=document.createElement('canvas');pc.width=W;pc.height=Math.round(pageH);
    const c=pc.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,W,pc.height);
    c.drawImage(canvas,0,y,W,end-y,0,top,W,end-y);
    out.push(pc);y=end;first=false;
  }
  return out;
}
function findCut(ctx,W,end,min){
  end=Math.floor(end);min=Math.floor(min);const h=end-min;if(h<2)return end;
  const d=ctx.getImageData(0,min,W,h).data;
  for(let row=h-1;row>=0;row--){
    let blank=true;
    for(let x=0;x<W;x+=3){const i=(row*W+x)*4;if(d[i]+d[i+1]+d[i+2]<720){blank=false;break;}}
    if(blank)return min+row;
  }
  return end;
}

/* Excel: tabel teks dengan jsPDF-AutoTable, bisa dicari */
async function excelToPdf(file,orient){
  status('Memuat pengubah Excel…',.05);
  await loadAll(['jspdf','autotable','xlsx']);
  status('Membaca sheet…',.2);
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  const {jsPDF}=window.jspdf;let doc=null;
  for(let si=0;si<wb.SheetNames.length;si++){
    const name=wb.SheetNames[si],ws=wb.Sheets[name];
    status('Menyusun sheet "'+name+'"…',.25+.7*si/wb.SheetNames.length);
    if(!ws||!ws['!ref'])continue;
    const range=XLSX.utils.decode_range(ws['!ref']);
    const raw=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:'',blankrows:true});
    let lastR=-1,lastC=-1;
    raw.forEach((r,i)=>r.forEach((v,j)=>{if(String(v).trim()!==''){lastR=Math.max(lastR,i);lastC=Math.max(lastC,j);}}));
    if(lastR<0)continue;
    const rows=raw.slice(0,lastR+1).map(r=>{const a=[];for(let j=0;j<=lastC;j++)a.push(clean(r[j]));return a;});
    const cell=rows.map(r=>r.map(v=>v)),skip=rows.map(r=>r.map(()=>false));
    for(const m of ws['!merges']||[]){
      const r0=m.s.r-range.s.r,c0=m.s.c-range.s.c;if(r0<0||c0<0||r0>lastR||c0>lastC)continue;
      const r1=Math.min(m.e.r-range.s.r,lastR),c1=Math.min(m.e.c-range.s.c,lastC);
      cell[r0][c0]={content:rows[r0][c0],rowSpan:r1-r0+1,colSpan:c1-c0+1};
      for(let i=r0;i<=r1;i++)for(let j=c0;j<=c1;j++)if(i!==r0||j!==c0)skip[i][j]=true;
    }
    const bodyRows=cell.map((r,i)=>r.filter((_,j)=>!skip[i][j]));
    const cols=lastC+1;
    const land=orient==='auto'?cols>6:orient==='landscape';const o=land?'landscape':'portrait';
    if(!doc)doc=new jsPDF({unit:'pt',format:'a4',orientation:o});else doc.addPage('a4',o);
    doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(30);
    doc.text(clean(name),36,40);
    const fs=cols<=6?10:cols<=10?8.5:cols<=16?7:5.5;
    doc.autoTable({
      body:bodyRows,startY:52,theme:'grid',margin:{left:36,right:36,top:36,bottom:36},
      horizontalPageBreak:cols>18,
      styles:{font:'helvetica',fontSize:fs,cellPadding:3,overflow:'linebreak',lineColor:[185,185,185],lineWidth:.5,textColor:25,valign:'middle'},
      didParseCell(d){
        const raw=d.cell.raw,v=String(raw&&typeof raw==='object'?raw.content:raw==null?'':raw).trim();
        if(/\d/.test(v)&&/^[-+(]?\s*(Rp\.?\s?)?[\d.,]+\s*%?\)?$/i.test(v))d.cell.styles.halign='right';
      }
    });
  }
  if(!doc)throw uerr('File Excel ini kosong, tidak ada data untuk diubah.');
  status('Menyusun PDF…',.97);
  return {blob:doc.output('blob'),name:baseName(file.name)+'.pdf',pages:doc.getNumberOfPages()};
}

/* Gambar: satu gambar per halaman */
function loadImg(url){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url;});}
async function imagesToPdf(items,mode,margin){
  status('Memuat pengubah gambar…',.05);
  await loadAll(['jspdf']);
  const {jsPDF}=window.jspdf;let doc=null;
  for(let i=0;i<items.length;i++){
    status('Memproses gambar '+(i+1)+' dari '+items.length+'…',.1+.85*i/items.length);
    let img;try{img=await loadImg(items[i].url);}
    catch(e){throw uerr('Gambar "'+items[i].file.name+'" tidak bisa dibaca. Gunakan format JPG atau PNG.');}
    let w=img.naturalWidth,h=img.naturalHeight;const k=Math.min(1,2400/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;const c=cv.getContext('2d');
    c.fillStyle='#fff';c.fillRect(0,0,w,h);c.drawImage(img,0,0,w,h);
    const data=cv.toDataURL('image/jpeg',.9);
    let PW,PH,x,y,dw,dh;
    if(mode==='a4'){
      const land=w>h;PW=land?842:595;PH=land?595:842;
      const s=Math.min((PW-2*margin)/w,(PH-2*margin)/h);dw=w*s;dh=h*s;x=(PW-dw)/2;y=(PH-dh)/2;
    }else{
      PW=595;PH=595*h/w;if(PH>2000){PH=2000;PW=2000*w/h;}
      x=margin;y=margin;dw=PW;dh=PH;PW+=2*margin;PH+=2*margin;
    }
    const o=PW>PH?'l':'p';
    if(!doc)doc=new jsPDF({unit:'pt',format:[PW,PH],orientation:o});else doc.addPage([PW,PH],o);
    doc.addImage(data,'JPEG',x,y,dw,dh,undefined,'FAST');
    await new Promise(r=>setTimeout(r));
  }
  status('Menyusun PDF…',.97);
  const first=items[0].file.name;
  return {blob:doc.output('blob'),name:(items.length>1?'Gambar '+items.length+' halaman':baseName(first))+'.pdf',pages:items.length};
}
